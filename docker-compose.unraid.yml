version: '3.8'

services:
  docker-dashboard:
    build:
      context: https://github.com/incari/docker-dash.git
      dockerfile: Dockerfile
    image: ghcr.io/incari/docker-dash:latest
    container_name: docker-dashboard
    restart: unless-stopped

    # The dashboard writes only to /app/data. Everything else is sealed, and
    # the process cannot gain capabilities it did not start with.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3080:3000"
    volumes:
      # Mount Docker socket for container access
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent data storage (Unraid path)
      - /mnt/user/appdata/docker-dashboard:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
    networks:
      - docker-dashboard-net

networks:
  docker-dashboard-net:
    driver: bridge

