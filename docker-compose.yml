services:
  docker-dashboard:
    image: ghcr.io/incari/docker-dash:latest
    container_name: docker-dashboard
    restart: unless-stopped

    # ============================================
    # TAILSCALE CONFIGURATION
    # ============================================
    # For Tailscale detection on Unraid/Linux hosts:
    # 1. Comment out 'ports' and 'networks' below
    # 2. Uncomment 'network_mode: host'
    # 3. App will be available at http://HOST_IP:3000

    # Option 1: Host Network (for Tailscale detection)
    # network_mode: host

    # Option 2: Bridge Network (standard setup, no Tailscale)
    ports:
      - "3080:3000"
    networks:
      - docker-dashboard-net

    volumes:
      # Mount Docker socket for container access
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent data storage
      - /mnt/user/appdata/docker-dashboard/config:/app/data
      # Only to read other machines over ssh:// - a key, known_hosts and an
      # optional config, owned by root. See "Over ssh" in the README.
      # - /opt/docker-dash/ssh:/root/.ssh:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
      - UPLOAD_DIR=/app/data/images
      # Lets LLM agents (Claude, Cursor...) run the dashboard over MCP at /mcp.
      # Generate with `openssl rand -hex 32`. See "Letting an agent run the
      # dashboard" in the README.
      # - MCP_TOKEN=

networks:
  docker-dashboard-net:
    driver: bridge

