name: Build Preview Image

# Pushes and pull requests to main are tested and the image is built, but
# nothing is published: every published build is one somebody asked for.
#
# Run it by hand with a tag (e.g. 0.4.0_rc) to publish a release candidate from
# any branch. latest and the version tags are only ever moved by
# .github/workflows/docker-release.yml, which promotes a candidate published
# here without rebuilding it.
#
# Why so strict about it: a tag that is pushed again leaves the build it used
# to name behind as an untagged version, and so does a tag that moves on every
# push. Together with an attestation manifest per build, that is how the
# package reached well over a hundred versions nobody could tell apart.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 0.4.0_rc. Never latest or a release version."
        required: true
      overwrite:
        description: "Replace the tag if it already exists (the old build is left untagged)"
        type: boolean
        default: false

# A newer push supersedes whatever is still building for the same ref, so
# stacked-up builds cancel themselves instead of needing to be cancelled by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_IMAGE: ghcr.io/incari/docker-dash

jobs:
  # Runs alongside the build rather than gating it: a preview never moves
  # latest, so a failing test should be loud without blocking the build.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend dependencies
        # better-sqlite3 compiles here thanks to pnpm.onlyBuiltDependencies;
        # without its native binding the backend tests cannot open a database.
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm test:backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm exec vitest run

  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::'$TAG' is not a valid image tag"
            exit 1
          fi
          if [ "$TAG" = "latest" ] || printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::'$TAG' is a release tag; those are only moved by the Release Docker Image workflow"
            exit 1
          fi
          if docker buildx imagetools inspect "${PREVIEW_IMAGE}:${TAG}" >/dev/null 2>&1 && [ "$OVERWRITE" != 'true' ]; then
            echo "::error::${PREVIEW_IMAGE}:${TAG} already exists. Pick a new tag (e.g. a second rc), or tick overwrite."
            exit 1
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREVIEW_IMAGE }}
          # Only the tag asked for. A build that is not published needs none.
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push preview image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # arm64 covers Raspberry Pi and ARM NAS boxes. It is cross-built under
          # QEMU, which is slow for better-sqlite3's native compile, so only a
          # build that is published pays for it.
          platforms: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          # No attestation or SBOM manifests: each one is another untagged
          # version in the package, and nothing here verifies them.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### Preview image published"
            echo
            echo '```'
            echo "docker pull ${{ env.PREVIEW_IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "Promote it with the **Release Docker Image** workflow, using digest"
            echo "\`${{ steps.build.outputs.digest }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
