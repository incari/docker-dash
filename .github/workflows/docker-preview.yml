name: Build Preview Image

# Every push to main builds a preview image, published to the same package as
# the releases under the `edge` tag. Users of `latest` and the version tags are
# never affected by what lands on main: those are only ever moved by
# .github/workflows/docker-release.yml.
#
# Run it by hand with a tag (e.g. 0.4.0_rc) to publish a release candidate from
# any branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 0.4.0_rc. Never latest or a release version."
        required: false

# A newer push supersedes whatever is still building for the same ref, so
# stacked-up builds cancel themselves instead of needing to be cancelled by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_IMAGE: ghcr.io/incari/docker-dash

jobs:
  # Runs alongside the build rather than gating it: a preview never moves
  # latest, so a failing test should be loud without blocking the build.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend dependencies
        # better-sqlite3 compiles here thanks to pnpm.onlyBuiltDependencies;
        # without its native binding the backend tests cannot open a database.
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm test:backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm exec vitest run

  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse to overwrite a release tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TAG" = "latest" ] || printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::'$TAG' is a release tag; those are only moved by the Release Docker Image workflow"
            exit 1
          fi

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREVIEW_IMAGE }}
          # Named tags only: a sha- tag per push buried the real ones in noise.
          # A digest still identifies any build exactly.
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
            type=ref,event=pr

      - name: Build and push preview image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # arm64 covers Raspberry Pi and ARM NAS boxes. It is cross-built under
          # QEMU, which is slow for better-sqlite3's native compile, so it is
          # skipped on pull requests - those never publish anything.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Preview image published"
            echo
            echo '```'
            echo "docker pull ${{ env.PREVIEW_IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "Promote it with the **Release Docker Image** workflow, using digest"
            echo "\`${{ steps.build.outputs.digest }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
