name: Build Preview Image

# Every push to main builds a preview image. It is published to a SEPARATE,
# private package so that pulling it requires authentication - users of the
# public image are never affected by what lands on main.
# The public image is only ever moved by .github/workflows/docker-release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes whatever is still building for the same ref, so
# stacked-up builds cancel themselves instead of needing to be cancelled by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_IMAGE: ghcr.io/incari/docker-dash-preview

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREVIEW_IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push preview image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # arm64 covers Raspberry Pi and ARM NAS boxes. It is cross-built under
          # QEMU, which is slow for better-sqlite3's native compile, so it is
          # skipped on pull requests - those never publish anything.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Preview image published"
            echo
            echo '```'
            echo "docker pull ${{ env.PREVIEW_IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "Promote it with the **Release Docker Image** workflow, using digest"
            echo "\`${{ steps.build.outputs.digest }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
