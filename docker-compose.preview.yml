# Runs a release candidate next to the stable instance, for trying a build
# before it is released.
#
# Release candidates are published to the same package as releases, under their
# own tag (e.g. 0.4.0_rc), so no login is needed. Pin a digest instead
# (ghcr.io/incari/docker-dash@sha256:...) when "the build I tested" and "the
# build that is running" must stay the same thing.
services:
  docker-dashboard-preview:
    image: ghcr.io/incari/docker-dash:0.4.0_rc
    container_name: docker-dashboard-preview
    restart: unless-stopped

    # The dashboard writes only to /app/data. Everything else is sealed, and
    # the process cannot gain capabilities it did not start with.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # A different host port from the stable instance, so both can run side by side.
    ports:
      - "3081:3000"
    networks:
      - docker-dashboard-preview-net

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Separate data directory: do NOT point this at the stable instance's
      # config. The preview runs its own migrations, and letting it touch the
      # live database would make rolling back much harder than deleting a folder.
      - /mnt/user/appdata/docker-dashboard-preview/config:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
      - UPLOAD_DIR=/app/data/images

networks:
  docker-dashboard-preview-net:
    driver: bridge
