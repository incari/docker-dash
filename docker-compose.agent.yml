# A docker-dash that another dashboard can read.
#
# Put this on every machine whose containers you want to see, and keep one
# ordinary docker-dash (the hub) as the dashboard you actually open.
#
# You do not have to invent a key: leave API_KEY out entirely, open this
# machine's own dashboard, tick "let another dashboard read this server" in the
# Servers panel and copy the key it shows you. Set API_KEY only if you would
# rather pin the key here - see the bottom of this file.
#
# This installation still serves its own dashboard on its own port, so nothing
# is lost by allowing a hub to read it.
services:
  docker-dash:
    image: ghcr.io/incari/docker-dash:latest
    container_name: docker-dash
    restart: unless-stopped

    # The dashboard writes only to /app/data. Everything else is sealed, and
    # the process cannot gain capabilities it did not start with.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      - "3080:3000"

    volumes:
      # Read this machine's containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Its own shortcuts, settings and API key, which the hub does not touch
      - ./data:/app/data

    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
      - UPLOAD_DIR=/app/data/images
      # How this machine is named when a hub reads it
      - HOST_NAME=NAS

      # Optional: pin the key instead of letting this machine generate one.
      # Setting it also switches reading on, and the key can then only be
      # changed here. Generate one with: openssl rand -hex 32
      # - API_KEY=a-long-random-string
